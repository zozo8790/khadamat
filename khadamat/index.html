<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خدماتي IQ - الدليل الشامل لكافة الخدمات والمحافظات</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
    body { font-family: 'Tajawal', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-12">

  <!-- الهيدر -->
  <header class="bg-blue-600 text-white p-4 sticky top-0 z-40 shadow-md">
    <div class="max-w-4xl mx-auto flex flex-col gap-3">
      <div class="flex justify-between items-center">
        <!-- العنوان الرئيسي (النقر 3 مرات للوحة التحكم) -->
        <h1 id="brandTitle" onclick="handleSecretClick()" class="text-2xl font-bold tracking-wide select-none cursor-pointer">
          خدماتي <span class="text-yellow-400">IQ</span>
        </h1>
        
        <div class="flex items-center gap-2">
          <!-- زر اقتراح مكان للزوار -->
          <button onclick="openSuggestModal()" class="text-xs bg-green-500 text-white px-3 py-1.5 rounded-full hover:bg-green-400 transition shadow font-bold flex items-center gap-1">
            <i class="fa-solid fa-lightbulb"></i> اقترح مكان
          </button>
          
          <!-- زر GPS -->
          <button onclick="getUserLocation()" id="locationBtn" class="text-xs bg-yellow-400 text-gray-900 font-bold px-3 py-1.5 rounded-full flex items-center gap-1 shadow hover:bg-yellow-300 transition">
            <i class="fa-solid fa-crosshairs"></i> <span id="locationBtnText">GPS</span>
          </button>
        </div>
      </div>

      <!-- اختيار المحافظة -->
      <div>
        <label class="block text-xs text-blue-100 mb-1 font-medium"><i class="fa-solid fa-map-location-dot ml-1"></i>اختر المحافظة:</label>
        <select id="provinceSelect" onchange="applyFilters()" class="w-full py-2 px-3 rounded-xl text-gray-900 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-sm">
          <option value="الكل">جميع المحافظات العراقية</option>
          <option value="بغداد">بغداد</option>
          <option value="الانبار">الأنبار</option>
          <option value="بابل">بابل</option>
          <option value="البصرة">البصرة</option>
          <option value="ديالى">ديالى</option>
          <option value="ذي قار">ذي قار</option>
          <option value="دهوك">دهوك</option>
          <option value="أربيل">أربيل</option>
          <option value="كربلاء المقدسة">كربلاء المقدسة</option>
          <option value="كركوك">كركوك</option>
          <option value="ميسان">ميسان</option>
          <option value="المثنى">المثنى</option>
          <option value="النجف الأشرف">النجف الأشرف</option>
          <option value="نينوى" selected>نينوى (الموصل)</option>
          <option value="القادسية">القادسية</option>
          <option value="صلاح الدين">صلاح الدين</option>
          <option value="السليمانية">السليمانية</option>
          <option value="واسط">واسط</option>
          <option value="حلبجة">حلبجة</option>
        </select>
      </div>

      <!-- شريط البحث المطور -->
      <div class="relative mt-1">
        <input type="text" id="searchInput" placeholder="ابحث بالاسم، العنوان، الهاتف، أو الوصف..." 
               class="w-full py-2.5 pr-10 pl-4 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-inner">
        <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3 text-gray-400"></i>
      </div>
    </div>
  </header>

  <!-- نافذة اقتراح مكان من قبل المستخدمين -->
  <div id="suggestModal" class="hidden fixed inset-0 bg-black/60 z-50 flex justify-center items-center p-4 transition-opacity">
    <div class="bg-white rounded-2xl p-5 w-full max-w-md relative shadow-2xl">
      <button onclick="closeSuggestModal()" class="absolute top-3 left-3 text-red-500 hover:text-red-700 text-xl"><i class="fa-solid fa-circle-xmark"></i></button>
      <h3 class="text-lg font-bold mb-3 text-gray-800"><i class="fa-solid fa-plus-circle text-green-500"></i> اقتراح إضافة مكان</h3>
      <p class="text-xs text-gray-500 mb-4">ساعدنا في تحسين الموقع! أرسل بيانات المكان وسنقوم بمراجعتها وإضافتها.</p>
      
      <form id="suggestForm" onsubmit="saveSuggestion(event)" class="space-y-3">
         <input type="text" id="sTitle" required placeholder="اسم المكان (مثال: مطعم سياحي)" class="w-full p-2 border rounded-xl text-sm focus:ring-2 focus:ring-green-400">
         <input type="text" id="sLocation" required placeholder="المحافظة - العنوان أو المنطقة" class="w-full p-2 border rounded-xl text-sm focus:ring-2 focus:ring-green-400">
         <input type="text" id="sPhone" placeholder="رقم الهاتف (اختياري)" class="w-full p-2 border rounded-xl text-sm focus:ring-2 focus:ring-green-400">
         <button type="submit" class="w-full bg-green-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-green-700 transition">إرسال الاقتراح</button>
      </form>
    </div>
  </div>

  <!-- لوحة التحكم السرية للمدير -->
  <section id="adminSection" class="hidden max-w-4xl mx-auto m-4 p-5 bg-white rounded-2xl border-2 border-blue-500 shadow-xl transition-all">
    <div class="flex justify-between items-center mb-4 pb-2 border-b">
      <h3 class="font-bold text-gray-800 text-base flex items-center gap-2">
        <i class="fa-solid fa-user-shield text-blue-600"></i> <span id="formTitle">إضافة مكان / خدمة جديدة</span>
      </h3>
      <button onclick="closeAdminPanel()" class="text-xs bg-red-100 text-red-600 px-3 py-1 rounded-lg hover:bg-red-200 font-bold">إغلاق اللوحة ✖</button>
    </div>

    <form id="placeForm" onsubmit="savePlace(event)" class="space-y-3">
      <input type="hidden" id="editDocId" value="">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">اسم المكان أو المحطة:</label>
          <input type="text" id="pTitle" required class="w-full p-2 border rounded-xl text-xs focus:ring-2 focus:ring-blue-400">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">القسم / التصنيف:</label>
          <select id="pCategory" required class="w-full p-2 border rounded-xl text-xs focus:ring-2 focus:ring-blue-400">
            <option value="وقود">محطات وقود</option>
            <option value="صحة">الصحة</option>
            <option value="مستشفيات">مستشفيات</option>
            <option value="صيدليات">صيدليات</option>
            <option value="مطاعم">مطاعم</option>
            <option value="كافيهات">كافيهات</option>
            <option value="تسوق">مولات وتسوق</option>
            <option value="متاجر">متاجر وماركتات</option>
            <option value="مالية">صيرفة ومالية</option>
            <option value="مصارف">مصارف وبنوك</option>
            <option value="ترفيه">ترفيه</option>
            <option value="فنادق">فنادق</option>
            <option value="خدمات">خدمات وصيانة</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">المحافظة:</label>
          <select id="pProvince" required class="w-full p-2 border rounded-xl text-xs focus:ring-2 focus:ring-blue-400">
            <option value="بغداد">بغداد</option>
            <option value="الانبار">الأنبار</option>
            <option value="بابل">بابل</option>
            <option value="البصرة">البصرة</option>
            <option value="ديالى">ديالى</option>
            <option value="ذي قار">ذي قار</option>
            <option value="دهوك">دهوك</option>
            <option value="أربيل">أربيل</option>
            <option value="حلبجة">حلبجة</option>
            <option value="كربلاء المقدسة">كربلاء المقدسة</option>
            <option value="كركوك">كركوك</option>
            <option value="ميسان">ميسان</option>
            <option value="المثنى">المثنى</option>
            <option value="النجف الأشرف">النجف الأشرف</option>
            <option value="نينوى">نينوى (الموصل)</option>
            <option value="القادسية">القادسية</option>
            <option value="صلاح الدين">صلاح الدين</option>
            <option value="السليمانية">السليمانية</option>
            <option value="واسط">واسط</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">حالة العمل / الملاحظة:</label>
          <input type="text" id="pStatus" placeholder="مثال: مفتوح 24 ساعة" class="w-full p-2 border rounded-xl text-xs focus:ring-2 focus:ring-blue-400">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">رقم الهاتف للاتصال:</label>
          <input type="text" id="pPhone" placeholder="07500000000" class="w-full p-2 border rounded-xl text-xs focus:ring-2 focus:ring-blue-400">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">رقم الواتساب (964):</label>
          <input type="text" id="pWhatsapp" placeholder="9647500000000" class="w-full p-2 border rounded-xl text-xs focus:ring-2 focus:ring-blue-400">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">العنوان التفصيلي:</label>
        <input type="text" id="pLocation" required class="w-full p-2 border rounded-xl text-xs focus:ring-2 focus:ring-blue-400">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">خط العرض Lat:</label>
          <input type="number" step="any" id="pLat" class="w-full p-2 border rounded-xl text-xs focus:ring-2 focus:ring-blue-400">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">خط الطول Lng:</label>
          <input type="number" step="any" id="pLng" class="w-full p-2 border rounded-xl text-xs focus:ring-2 focus:ring-blue-400">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">رابط خرائط جوجل:</label>
          <input type="url" id="pMapUrl" class="w-full p-2 border rounded-xl text-xs focus:ring-2 focus:ring-blue-400">
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button type="submit" id="saveBtn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-xl text-xs transition">
          <i class="fa-solid fa-floppy-disk ml-1"></i> حفظ البيانات
        </button>
        <button type="button" onclick="resetForm()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-4 py-2 rounded-xl text-xs">تفريغ</button>
      </div>
    </form>
  </section>

  <!-- الأقسام الرئيسية -->
  <main class="max-w-4xl mx-auto p-4 space-y-6">
    <section>
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-bold text-gray-700 flex items-center gap-2">
          <i class="fa-solid fa-layer-group text-blue-600"></i> الأقسام
        </h2>
        <button onclick="resetCategoryFilter()" class="text-xs text-blue-600 font-semibold underline">عرض الكل</button>
      </div>
      
      <div class="grid grid-cols-4 sm:grid-cols-4 gap-2 text-center">
        <!-- أزرار الأقسام مصغرة قليلاً لتناسب الشاشات -->
        <button onclick="filterCategory('وقود')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition flex flex-col items-center gap-1">
          <div class="w-8 h-8 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center text-sm"><i class="fa-solid fa-gas-pump"></i></div>
          <span class="text-[10px] font-bold text-gray-700">وقود</span>
        </button>
        <button onclick="filterCategory('صحة')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition flex flex-col items-center gap-1">
          <div class="w-8 h-8 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-sm"><i class="fa-solid fa-house-medical"></i></div>
          <span class="text-[10px] font-bold text-gray-700">صحة</span>
        </button>
        <button onclick="filterCategory('مستشفيات')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition flex flex-col items-center gap-1">
          <div class="w-8 h-8 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-sm"><i class="fa-solid fa-hospital"></i></div>
          <span class="text-[10px] font-bold text-gray-700">مستشفيات</span>
        </button>
        <button onclick="filterCategory('صيدليات')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition flex flex-col items-center gap-1">
          <div class="w-8 h-8 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-sm"><i class="fa-solid fa-pills"></i></div>
          <span class="text-[10px] font-bold text-gray-700">صيدليات</span>
        </button>
        <button onclick="filterCategory('مطاعم')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition flex flex-col items-center gap-1">
          <div class="w-8 h-8 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-sm"><i class="fa-solid fa-utensils"></i></div>
          <span class="text-[10px] font-bold text-gray-700">مطاعم</span>
        </button>
        <button onclick="filterCategory('كافيهات')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition flex flex-col items-center gap-1">
          <div class="w-8 h-8 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-sm"><i class="fa-solid fa-mug-hot"></i></div>
          <span class="text-[10px] font-bold text-gray-700">كافيهات</span>
        </button>
        <button onclick="filterCategory('تسوق')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition flex flex-col items-center gap-1">
          <div class="w-8 h-8 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-sm"><i class="fa-solid fa-cart-shopping"></i></div>
          <span class="text-[10px] font-bold text-gray-700">تسوق</span>
        </button>
        <button onclick="filterCategory('مالية')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition flex flex-col items-center gap-1">
          <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-sm"><i class="fa-solid fa-money-bill-transfer"></i></div>
          <span class="text-[10px] font-bold text-gray-700">مالية</span>
        </button>
        <button onclick="filterCategory('مصارف')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition flex flex-col items-center gap-1">
          <div class="w-8 h-8 rounded-full bg-teal-100 text-teal-600 flex items-center justify-center text-sm"><i class="fa-solid fa-building-columns"></i></div>
          <span class="text-[10px] font-bold text-gray-700">مصارف</span>
        </button>
        <button onclick="filterCategory('فنادق')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition flex flex-col items-center gap-1">
          <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-sm"><i class="fa-solid fa-hotel"></i></div>
          <span class="text-[10px] font-bold text-gray-700">فنادق</span>
        </button>
        <button onclick="filterCategory('ترفيه')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition flex flex-col items-center gap-1">
          <div class="w-8 h-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-sm"><i class="fa-solid fa-water-ladder"></i></div>
          <span class="text-[10px] font-bold text-gray-700">ترفيه</span>
        </button>
        <button onclick="filterCategory('متاجر')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition flex flex-col items-center gap-1">
          <div class="w-8 h-8 rounded-full bg-pink-100 text-pink-600 flex items-center justify-center text-sm"><i class="fa-solid fa-bag-shopping"></i></div>
          <span class="text-[10px] font-bold text-gray-700">متاجر</span>
        </button>
        <button onclick="filterCategory('خدمات')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition flex flex-col items-center gap-1">
          <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-sm"><i class="fa-solid fa-wrench"></i></div>
          <span class="text-[10px] font-bold text-gray-700">خدمات</span>
        </button>
      </div>
    </section>

    <!-- قائمة النتائج -->
    <section>
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-bold text-gray-700 flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-red-500"></i> الأماكن والخدمات
        </h2>
        <span class="text-xs text-gray-600 font-medium" id="itemCount">جاري التحميل...</span>
      </div>

      <div id="placesContainer" class="space-y-3">
        <!-- الكروت تظهر هنا -->
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXz6GlHtMvMkKZC9qC19BDnmrjIdtoL7A",
      authDomain: "khadamati-iq-b49cf.firebaseapp.com",
      projectId: "khadamati-iq-b49cf",
      storageBucket: "khadamati-iq-b49cf.firebasestorage.app",
      messagingSenderId: "357125467548",
      appId: "1:357125467548:web:c6c51a3a3ed861f98aec59",
      measurementId: "G-L2JBM16BC6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.userLat = null;
    window.userLng = null;
    window.selectedCategory = "الكل";
    window.isAdminLoggedIn = false;
    window.allPlacesData = [];

    /* =========================================
       نظام الدخول السري
    ========================================= */
    let clickCount = 0;
    let clickTimer = null;

    window.handleSecretClick = function() {
      clickCount++;
      clearTimeout(clickTimer);
      clickTimer = setTimeout(() => { clickCount = 0; }, 1000);

      if (clickCount >= 3) {
        clickCount = 0;
        openAdminModal();
      }
    };

    function openAdminModal() {
      if (!window.isAdminLoggedIn) {
        const pass = prompt("أدخل رمز الوصول السري:");
        if (pass === "1234") { 
          window.isAdminLoggedIn = true;
          document.getElementById('adminSection').classList.remove('hidden');
          window.applyFilters();
        } else if (pass !== null) {
          alert("الرمز السري غير صحيح!");
        }
      } else {
        document.getElementById('adminSection').classList.toggle('hidden');
      }
    }

    window.closeAdminPanel = function() {
      document.getElementById('adminSection').classList.add('hidden');
    };

    /* =========================================
       اقتراح مكان جديد (للزوار)
    ========================================= */
    window.openSuggestModal = () => document.getElementById('suggestModal').classList.remove('hidden');
    window.closeSuggestModal = () => document.getElementById('suggestModal').classList.add('hidden');
    
    window.saveSuggestion = async function(e) {
      e.preventDefault();
      const sTitle = document.getElementById('sTitle').value;
      const sLocation = document.getElementById('sLocation').value;
      const sPhone = document.getElementById('sPhone').value;
      
      try {
        await addDoc(collection(db, "suggestions"), {
          title: sTitle,
          location: sLocation,
          phone: sPhone,
          timestamp: new Date().toISOString()
        });
        alert("تم إرسال اقتراحك بنجاح! سيقوم فريقنا بمراجعته وإضافته قريباً. شكراً لك 🤍");
        document.getElementById('suggestForm').reset();
        window.closeSuggestModal();
      } catch (err) {
        alert("حدث خطأ أثناء الإرسال: " + err.message);
      }
    };

    /* =========================================
       إضافة وتعديل الأماكن (للمدير)
    ========================================= */
    window.resetForm = function() {
      document.getElementById('placeForm').reset();
      document.getElementById('editDocId').value = "";
      document.getElementById('formTitle').innerText = "إضافة مكان / خدمة جديدة";
    };

    window.savePlace = async function(e) {
      e.preventDefault();
      const docId = document.getElementById('editDocId').value;
      const placeData = {
        title: document.getElementById('pTitle').value,
        category: document.getElementById('pCategory').value,
        province: document.getElementById('pProvince').value,
        status: document.getElementById('pStatus').value || "مفتوح الآن",
        phone: document.getElementById('pPhone').value,
        whatsapp: document.getElementById('pWhatsapp').value,
        location: document.getElementById('pLocation').value,
        lat: parseFloat(document.getElementById('pLat').value) || null,
        lng: parseFloat(document.getElementById('pLng').value) || null,
        mapUrl: document.getElementById('pMapUrl').value || "#"
      };

      try {
        if (docId) {
          await updateDoc(doc(db, "places", docId), placeData);
          alert("تم التعديل بنجاح ✅");
        } else {
          await addDoc(collection(db, "places"), placeData);
          alert("تمت الإضافة بنجاح ✅");
        }
        window.resetForm();
      } catch (err) { alert("خطأ: " + err.message); }
    };

    window.editPlace = function(id) {
      const item = window.allPlacesData.find(p => p.id === id);
      if (!item) return;
      document.getElementById('adminSection').classList.remove('hidden');
      document.getElementById('editDocId').value = item.id;
      document.getElementById('pTitle').value = item.title || '';
      document.getElementById('pCategory').value = item.category || '';
      document.getElementById('pProvince').value = item.province || '';
      document.getElementById('pStatus').value = item.status || '';
      document.getElementById('pPhone').value = item.phone || '';
      document.getElementById('pWhatsapp').value = item.whatsapp || '';
      document.getElementById('pLocation').value = item.location || '';
      document.getElementById('pLat').value = item.lat || '';
      document.getElementById('pLng').value = item.lng || '';
      document.getElementById('pMapUrl').value = item.mapUrl || '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deletePlace = async function(id) {
      if (confirm("هل أنت متأكد من الحذف؟")) {
        await deleteDoc(doc(db, "places", id));
      }
    };

    /* =========================================
       نظام المشاركة Share
    ========================================= */
    window.sharePlace = function(title, location) {
      const shareData = {
        title: title,
        text: `شاهد هذا المكان على تطبيق خدماتي IQ: ${title} - ${location}`,
        url: window.location.href
      };
      if (navigator.share) {
        navigator.share(shareData).catch(console.error);
      } else {
        alert("متصفحك لا يدعم هذه الميزة، لكن يمكنك نسخ الرابط من الأعلى.");
      }
    };

    /* =========================================
       GPS وفلترة البيانات
    ========================================= */
    function calculateDistance(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return null;
      const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    window.getUserLocation = function() {
      const btn = document.getElementById('locationBtnText');
      if (navigator.geolocation) {
        btn.innerText = "...";
        navigator.geolocation.getCurrentPosition(
          (p) => {
            window.userLat = p.coords.latitude; window.userLng = p.coords.longitude;
            btn.innerText = "GPS ✅";
            document.getElementById('locationBtn').classList.replace('bg-yellow-400', 'bg-emerald-400');
            window.applyFilters();
          }, () => { btn.innerText = "GPS"; window.applyFilters(); }
        );
      }
    };

    window.applyFilters = function() {
      const prov = document.getElementById('provinceSelect').value;
      const query = document.getElementById('searchInput').value.toLowerCase();
      let filtered = [...window.allPlacesData];

      if (prov !== "الكل") filtered = filtered.filter(item => item.province === prov);
      if (window.selectedCategory !== "الكل") filtered = filtered.filter(item => item.category === window.selectedCategory);
      
      // بحث متقدم يشمل الاسم، العنوان، الهاتف، والملاحظات
      if (query.trim() !== "") {
        filtered = filtered.filter(item => 
          (item.title && item.title.toLowerCase().includes(query)) || 
          (item.location && item.location.toLowerCase().includes(query)) ||
          (item.phone && item.phone.includes(query)) ||
          (item.status && item.status.toLowerCase().includes(query))
        );
      }

      filtered.forEach(item => {
        item.distance = (window.userLat && window.userLng && item.lat && item.lng) ? calculateDistance(window.userLat, window.userLng, item.lat, item.lng) : null;
      });

      if (window.userLat && window.userLng) {
        filtered.sort((a, b) => (a.distance === null) ? 1 : (b.distance === null) ? -1 : a.distance - b.distance);
      }

      window.renderPlaces(filtered);
    };

    window.filterCategory = function(c) { window.selectedCategory = c; window.applyFilters(); };
    window.resetCategoryFilter = function() { window.selectedCategory = "الكل"; window.applyFilters(); };

    /* =========================================
       رسم الكروت HTML
    ========================================= */
    window.renderPlaces = function(data) {
      const container = document.getElementById('placesContainer');
      document.getElementById('itemCount').innerText = `العدد: ${data.length}`;
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-gray-500 bg-white rounded-2xl border border-gray-100">لا توجد نتائج مطابقة لبحثك</div>`;
        return;
      }

      data.forEach(item => {
        let dist = '';
        if (item.distance !== null && item.distance !== undefined) {
          const d = item.distance < 1 ? `${Math.round(item.distance * 1000)} متر` : `${item.distance.toFixed(1)} كم`;
          dist = `<span class="text-[10px] bg-red-50 text-red-600 px-2 py-0.5 rounded-full font-bold"><i class="fa-solid fa-location-arrow"></i> ${d}</span>`;
        }

        let adminBtns = '';
        if (window.isAdminLoggedIn) {
          adminBtns = `
            <div class="flex flex-col gap-1 pr-2 border-r border-gray-200">
              <button onclick="editPlace('${item.id}')" class="text-yellow-600 bg-yellow-50 p-1.5 rounded-lg"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deletePlace('${item.id}')" class="text-red-600 bg-red-50 p-1.5 rounded-lg"><i class="fa-solid fa-trash"></i></button>
            </div>`;
        }

        const card = `
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row gap-4 hover:shadow-md transition">
            <div class="flex-1">
              <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                <h3 class="font-bold text-base text-gray-800">${item.title}</h3>
                ${item.status ? `<span class="text-[10px] bg-green-50 text-green-700 px-2 py-0.5 rounded-full">${item.status}</span>` : ''}
                ${dist}
              </div>
              <p class="text-xs text-gray-500 mb-3"><i class="fa-solid fa-map-pin ml-1 text-red-400"></i>${item.location}</p>
              
              <!-- أزرار الإجراءات والمشاركة -->
              <div class="flex flex-wrap items-center gap-2">
                ${item.phone ? `<a href="tel:${item.phone}" class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-phone ml-1"></i>اتصال</a>` : ''}
                ${item.whatsapp ? `<a href="https://wa.me/${item.whatsapp}" target="_blank" class="bg-green-50 text-green-600 hover:bg-green-100 px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-brands fa-whatsapp ml-1 text-sm"></i>واتساب</a>` : ''}
                ${item.mapUrl && item.mapUrl !== '#' ? `<a href="${item.mapUrl}" target="_blank" class="bg-gray-100 text-gray-700 hover:bg-gray-200 px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-diamond-turn-right ml-1"></i>الخريطة</a>` : ''}
                <button onclick="sharePlace('${item.title}', '${item.location}')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-share-nodes ml-1"></i>مشاركة</button>
              </div>
            </div>
            ${adminBtns}
          </div>
        `;
        container.innerHTML += card;
      });
    };

    document.getElementById('searchInput').addEventListener('input', window.applyFilters);
    window.addEventListener('DOMContentLoaded', () => { window.getUserLocation(); });

    // الجلب المباشر
    const placesRef = collection(db, "places");
    onSnapshot(placesRef, (snapshot) => {
      const fetched = [];
      snapshot.forEach((doc) => fetched.push({ id: doc.id, ...doc.data() }));
      window.allPlacesData = fetched;
      window.applyFilters();
    });
  </script>
</body>
</html>
